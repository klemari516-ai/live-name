<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Name</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background:#cfeeff;
  overflow:hidden;
  font-family:'Pacifico',cursive;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* LOGO */
#logo{
  font-size:72px;
  max-width:92vw;
  text-align:center;
  padding:26px 42px;
  border-radius:44px;
  background:rgba(255,255,255,.25);
  color:#3aa7ff;
  text-shadow:
    3px 3px 0 #fff,
    6px 6px 0 rgba(0,0,0,.15);
  animation:pop .35s ease;
  word-break:break-word;
}

@keyframes pop{
  from{transform:scale(.88)}
  to{transform:scale(1)}
}

/* INPUT INVISIBLE */
#input{
  position:absolute;
  opacity:0;
  caret-color:transparent;
}

/* REKAP MINI */
#rekap{
  position:absolute;
  top:6px;
  left:6px;
  width:58px;
  font-size:8px;
  background:rgba(255,255,255,.4);
  border-radius:7px;
  padding:3px;
}

#rekap b{
  display:block;
  text-align:center;
  font-size:8px;
  margin-bottom:2px;
}

#rekap ul{
  list-style:none;
}

#rekap li{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.15;
}
</style>
</head>

<body>
<div id="app" onclick="focusInput()">

  <div id="logo">NAMA</div>

  <div id="rekap">
    <b>LIST</b>
    <ul id="list"></ul>
  </div>

  <input id="input" autocomplete="off">

  <audio id="sound" src="https://actions.google.com/sounds/v1/cartoon/pop.ogg"></audio>
</div>

<script>
const input = document.getElementById("input");
const logo  = document.getElementById("logo");
const list  = document.getElementById("list");
const sound = document.getElementById("sound");

let names=[];

function focusInput(){
  input.focus();
}

function randomColor(){
  const c=["#3aa7ff","#ff7ad9","#6ee7b7","#ffd166","#c77dff","#ff8fab"];
  return c[Math.floor(Math.random()*c.length)];
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const val=input.value.trim();
    if(!val) return;

    logo.textContent=val;
    logo.style.color=randomColor();

    logo.style.animation="none";
    logo.offsetHeight;
    logo.style.animation="pop .35s ease";

    sound.currentTime=0;
    sound.play();

    names.push(val);
    if(names.length>10) names=[];

    render();
    input.value="";
  }
});

function render(){
  list.innerHTML="";
  names.forEach(n=>{
    const li=document.createElement("li");
    li.textContent=n;
    list.appendChild(li);
  });
}

setTimeout(()=>input.focus(),500);
</script>
</body>
</html>
